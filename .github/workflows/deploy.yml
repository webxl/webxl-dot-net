name: Deploy

on:
  push:
    branches:
      - master
      - deploy-fix
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        uses: bahmutov/npm-install@v1

      - name: Build project
        run: npm run build

      - name: Upload production-ready build files
        uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: ./dist

  deploy:
    name: Deploy to webxl LXC
    needs: build
    runs-on: [self-hosted, webxl-ct]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/deploy-fix'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: production-files
          path: /tmp/deploy-dist

      - name: Sync to webroot
        run: |
          rsync -a --delete /tmp/deploy-dist/ /var/www/webxl/
          rm -rf /tmp/deploy-dist
