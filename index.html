<!DOCTYPE html>
<html lang="en">
  <head>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <!-- JSON-LD: Person -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Matt Motherway",
      "jobTitle": "Senior Full-Stack Engineer",
      "email": "matt@motherway.dev",
      "url": "https://webxl.net",
      "sameAs": [
        "https://motherway.dev",
        "https://github.com/webxl",
        "https://linkedin.com/in/webxl"
      ],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Reno",
        "addressRegion": "NV",
        "addressCountry": "US"
      },
      "knowsAbout": [
        "TypeScript", "React", "Node.js", "PostgreSQL", "Go", "GraphQL",
        "AWS", "Docker", "Kubernetes", "Python", "C#", ".NET"
      ],
      "hasCredential": {
        "@type": "EducationalOccupationalCredential",
        "credentialCategory": "degree",
        "educationalLevel": "Bachelor of Arts",
        "recognizedBy": {
          "@type": "CollegeOrUniversity",
          "name": "Stanford University"
        }
      }
    }
    </script>

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Matt Motherway",
      "url": "https://webxl.net",
      "description": "Personal site and portfolio of Matt Motherway, Senior Full-Stack Engineer.",

      }
    }
