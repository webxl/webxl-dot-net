name = "snake3d-mp"
main = "src/index.js"
compatibility_date = "2026-01-01"

# One Durable Object per challenge code; it holds at most two sockets and
# relays signalling (and game traffic if the direct WebRTC link fails).
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
